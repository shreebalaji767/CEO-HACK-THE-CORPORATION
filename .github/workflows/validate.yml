name: Validate ExecutiveOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("Inline script not found");
          fs.writeFileSync("/tmp/executiveos-inline.js", html.slice(start + 8, end));
          NODE
          node --check /tmp/executiveos-inline.js
          node --check world-sim.js
          node --check sw.js
      - name: Check existing systems and World Simulation
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const w = fs.readFileSync("world-sim.js", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");
          const checks = [
            ["dark-only color scheme", h.includes("color-scheme:dark")],
            ["CEO simulator route", h.includes('id="page-ceo"')],
            ["corporate empire route", h.includes('id="page-corporate"')],
            ["Strategy Lab route", h.includes('id="page-strategy"')],
            ["passive business income", h.includes("function businessIncome(")],
            ["fictional share market", h.includes("function tradeStock(")],
            ["XP progression", h.includes("function awardXP(")],
            ["earn-money levels", h.includes("const earnTiers=")],
            ["responsive breakpoints", h.includes("@media(max-width:600px)")],
            ["asset market page", h.includes('id="page-assets" data-route="assets"')],
            ["World Simulation route", w.includes('page.dataset.route="world"')],
            ["rival corporations", w.includes("rivals") && w.includes("rival:")],
            ["boardroom decisions", w.includes("Boardroom agenda")],
            ["research portfolio", w.toLowerCase().includes("orbital manufacturing")],
            ["world export and import", w.includes("worldExport") && w.includes("worldImport")],
            ["world module loaded", h.includes('src="./world-sim.js"')],
            ["offline world module cached", sw.includes('"world-sim.js"')],
            ["responsive stylesheet linked", h.includes('href="./executiveos-ui.css"')],
            ["responsive stylesheet exists", fs.existsSync("executiveos-ui.css")],
            ["mobile navigation styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:850px)")],
            ["small-screen layout styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:600px)")],
            ["service worker cache version", sw.includes('CACHE_NAME = CACHE_PREFIX + "v17"')],
            ["manual world save", w.includes("worldSave") && w.includes("localStorage.setItem(KEY")]
          ];
          for (const [name, ok] of checks) console.log((ok ? "PASS " : "FAIL ") + name);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE
