name: Validate ExecutiveOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("Inline script not found");
          fs.writeFileSync("/tmp/executiveos-inline.js", html.slice(start + 8, end));
          NODE
          node --check /tmp/executiveos-inline.js
          node --check world-sim.js
          node --check sw.js
          node --input-type=module --check < three-card-depth.js
          node --input-type=module --check < three.module.min.js
          node --input-type=module --check < three.core.min.js
      - name: Check existing systems and World Simulation
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const w = fs.readFileSync("world-sim.js", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");
          const checks = [
            ["dark-only color scheme", h.includes("color-scheme:dark")],
            ["CEO simulator route", h.includes('id="page-ceo"')],
            ["corporate empire route", h.includes('id="page-corporate"')],
            ["Strategy Lab route", h.includes('id="page-strategy"')],
            ["passive business income", h.includes("function businessIncome(")],
            ["fictional share market", h.includes("function tradeStock(")],
            ["XP progression", h.includes("function awardXP(")],
            ["earn-money levels", h.includes("const earnTiers=")],
            ["responsive breakpoints", h.includes("@media(max-width:600px)")],
            ["asset market page", h.includes('id="page-assets" data-route="assets"')],
            ["World Simulation route", w.includes('page.dataset.route="world"')],
            ["rival corporations", w.includes("rivals") && w.includes("rival:")],
            ["boardroom decisions", w.includes("Boardroom agenda")],
            ["research portfolio", w.toLowerCase().includes("orbital manufacturing")],
            ["world export and import", w.includes("worldExport") && w.includes("worldImport")],
            ["world module loaded", h.includes('src="./world-sim.js?v=44"')],
            ["offline world module cached", sw.includes('"world-sim.js"')],
            ["responsive stylesheet linked", h.includes('href="./executiveos-ui.css?v=44"')],
            ["responsive stylesheet exists", fs.existsSync("executiveos-ui.css")],
            ["mobile navigation styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:850px)")],
            ["small-screen layout styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:600px)")],
            ["service worker cache version", sw.includes('CACHE_NAME = CACHE_PREFIX + "v44"')],
            ["service worker installs fresh app shell assets", sw.includes('new Request(absolute(path), {cache: "reload"})') && sw.includes("cache.put(request, response)")],
            ["old app caches are removed on activation", sw.includes("key.startsWith(CACHE_PREFIX) && key !== CACHE_NAME") && sw.includes("await self.clients.claim()")],
            ["online app code refreshes before cache fallback", sw.includes('["style", "script", "document"].includes(request.destination)') && sw.includes('fetch(request, {cache: "no-store"})')],
            ["PWA checks for updates and reloads on new controller", h.includes('updateViaCache:"none"') && h.includes("await registration.update()") && h.includes('addEventListener("controllerchange"')],
            ["current UI assets use versioned URLs", h.includes("executiveos-ui.css?v=44") && h.includes("three-card-depth.js?v=44") && h.includes("world-sim.js?v=44")],
            ["versioned app assets are precached for offline launches", sw.includes('"executiveos-ui.css?v=44"') && sw.includes('"three-card-depth.js?v=44"') && sw.includes('"world-sim.js?v=44"')],
            ["charcoal theme matches browser chrome", h.includes('<meta name="theme-color" content="#090a0e">') && fs.readFileSync("manifest.webmanifest", "utf8").includes('"theme_color": "#090a0e"')],
            ["mobile KPI cards remain compact", fs.readFileSync("executiveos-ui.css", "utf8").includes("grid-template-columns:repeat(2,minmax(0,1fr))!important")],
            ["clean monochrome design is present", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified monochrome component system") && fs.readFileSync("executiveos-ui.css", "utf8").includes("--ui-surface:#141414")],
            ["unified clean component system", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified monochrome component system") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".world-toolbar")],
            ["legacy competing theme layers removed", !/Blue-forward visual identity|ExecutiveOS monochrome glass system|Glass card UI|Clean monochrome UI/.test(fs.readFileSync("executiveos-ui.css", "utf8"))],
            ["black-and-white glass cards enabled", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified black-and-white glass system") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(20px)")],
            ["charcoal black and white text palette is active", fs.readFileSync("executiveos-ui.css", "utf8").includes("--bg:#090a0e") && fs.readFileSync("executiveos-ui.css", "utf8").includes("--text:#f7f8fc") && fs.readFileSync("index.html", "utf8").includes("--green:#f7f8fc")],
            ["navy glow is the only neon accent", fs.readFileSync("executiveos-ui.css", "utf8").includes("--neon-blue:#3156d8") && fs.readFileSync("executiveos-ui.css", "utf8").includes("0 0 32px rgba(35,65,180,.30)")],
            ["PWA browser chrome uses charcoal black", fs.readFileSync("index.html", "utf8").includes('<meta name="theme-color" content="#090a0e">') && fs.readFileSync("manifest.webmanifest", "utf8").includes('"theme_color": "#090a0e"')],
            ["navy-blue neon palette is active", fs.readFileSync("executiveos-ui.css", "utf8").includes("--neon-blue:#4169ff") && fs.readFileSync("executiveos-ui.css", "utf8").includes("rgba(35,75,255,.56)")],
            ["navy-blue neon glass cards and logo glow", fs.readFileSync("executiveos-ui.css", "utf8").includes("Navy-blue neon identity") && fs.readFileSync("executiveos-ui.css", "utf8").includes("0 0 32px rgba(35,75,255,.30)")],
            ["matching navy-glow logo and PWA icons", ["favicon.svg","icon-192.svg","icon-512.svg"].every(file => fs.readFileSync(file, "utf8").includes('flood-color="#4169ff"'))],
            ["offline cache refreshed for neon assets", sw.includes('CACHE_NAME = CACHE_PREFIX + "v44"')],
            ["status label cannot hide navigation", fs.readFileSync("executiveos-ui.css", "utf8").includes(".status{display:none!important}") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".navlinks{display:flex!important;flex:1 1 auto!important")],
            ["navigation bar uses glass treatment", fs.readFileSync("executiveos-ui.css", "utf8").includes(".topbar{") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(26px)") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".navlinks.open")],
            ["glass styling covers core modules", [".panel,.stat,.card,.feature,.hero-art",".world-kpi,.world-panel",".exec-kpi",".modal,.palette"].every(selector => fs.readFileSync("executiveos-ui.css", "utf8").includes(selector))],
            ["layout wrappers remain visually neutral", fs.readFileSync("executiveos-ui.css", "utf8").includes(".settingsrow,.eventchoices,.actionlist,.feeditem,.strategy-row")],
            ["dashboard captions are not form labels", (h.match(/<span class="stat-label">/g) || []).length === 26 && !/<label>/i.test(h)],
            ["asset search label is associated", h.includes('<label for="assetSearch">Search the entire asset universe</label><input id="assetSearch"')],
            ["save slot label is associated", h.includes('<label for="saveSlot" class="muted smalltext">Slot</label><select class="field" id="saveSlot"')],
            ["reduce motion checkbox has an enclosing label", h.includes('<label class="muted smalltext"><input type="checkbox" id="reduceMotion"> Reduce motion</label>')],
            ["strict three-tone palette is last stylesheet layer", fs.readFileSync("executiveos-ui.css", "utf8").includes("STRICT THREE-TONE FINISH") && fs.readFileSync("executiveos-ui.css", "utf8").lastIndexOf("STRICT THREE-TONE FINISH") > fs.readFileSync("executiveos-ui.css", "utf8").lastIndexOf("Navy-blue neon identity")],
            ["strict theme maps all semantic status colors to white", /--green:#f7f8fc!important;--green2:#f7f8fc!important;--amber:#f7f8fc!important;--red:#f7f8fc!important/.test(fs.readFileSync("executiveos-ui.css", "utf8"))],
            ["legacy inline shell green accents replaced", !["#b9f27c","#a9ef7020","#5a8c43","#17251a","#47713a"].some(color => fs.readFileSync("index.html", "utf8").split("<style>")[1].split("</style>")[0].includes(color))],
            ["terminal and world status accents are neutral", fs.readFileSync("executiveos-ui.css", "utf8").includes(".world-good,.world-warn") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".termline.warn,.termline.err,.termline.good{color:#d4d8e2!important}")],
            ["PWA install prompt captured", h.includes('addEventListener("beforeinstallprompt"') && h.includes("event.preventDefault();deferredInstallPrompt=event")],
            ["PWA install button invokes native prompt", h.includes('addEventListener("click",()=>installApp())') && h.includes("await promptEvent.prompt()") && h.includes("await promptEvent.userChoice")],
            ["installed app state is reflected", h.includes('addEventListener("appinstalled"') && h.includes('b.disabled=true')],
            ["install button remains visible on narrow phones", !h.includes(".navright #installBtn{display:none}")],
            ["Three.js card layer is loaded", h.includes('<script type="module" src="./three-card-depth.js?v=44"></script>')],
            ["local Three.js r180 bundle is cached", sw.includes('"three.module.min.js"') && fs.existsSync("three.module.min.js")],
            ["Three.js core dependency is cached locally", sw.includes('"three.core.min.js"') && fs.existsSync("three.core.min.js")],
            ["Three.js card scene creates 3D box meshes", fs.readFileSync("three-card-depth.js", "utf8").includes('from "./three.module.min.js"') && fs.readFileSync("three-card-depth.js", "utf8").includes("new THREE.BoxGeometry") && fs.readFileSync("three-card-depth.js", "utf8").includes("new THREE.WebGLRenderer")],
            ["Three.js card renderer has a no-WebGL fallback", fs.readFileSync("three-card-depth.js", "utf8").includes("three-card-ready") && fs.readFileSync("executiveos-ui.css", "utf8").includes("body:not(.three-card-ready) .three-depth-card:hover")],
            ["low-glow card surfaces replace neon halos", fs.readFileSync("executiveos-ui.css", "utf8").includes("Low-glow 3D card finish") && fs.readFileSync("executiveos-ui.css", "utf8").includes("var(--card-shadow)")],
            ["frosted glass finish covers cards and navigation", fs.readFileSync("executiveos-ui.css", "utf8").includes("Frosted glass finish layered") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(22px) saturate(140%)")],
            ["Three.js card bodies use translucent physical glass materials", fs.readFileSync("three-card-depth.js", "utf8").includes("new THREE.MeshPhysicalMaterial") && fs.readFileSync("three-card-depth.js", "utf8").includes("opacity: 0.66") && fs.readFileSync("three-card-depth.js", "utf8").includes("clearcoat: 0.9")],
            ["3D cards animate and respond to pointer tilt", fs.readFileSync("three-card-depth.js", "utf8").includes("requestAnimationFrame(render)") && fs.readFileSync("three-card-depth.js", "utf8").includes("entry.mesh.rotation.x = -ny * 0.018") && fs.readFileSync("executiveos-ui.css", "utf8").includes("@keyframes executiveCardFloat") && fs.readFileSync("executiveos-ui.css", "utf8").includes("rotateX(2.8deg) rotateY(-3.2deg)")],
            ["glass UI overlays Three.js card depth", fs.readFileSync("executiveos-ui.css", "utf8").includes("Frosted glass finish layered") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(22px) saturate(140%)")],
            ["Three.js card faces use translucent materials", fs.readFileSync("three-card-depth.js", "utf8").includes("opacity: 0.66") && fs.readFileSync("three-card-depth.js", "utf8").includes("opacity: 0.88") && fs.readFileSync("three-card-depth.js", "utf8").includes("entry.mesh.scale.set(width, height, 22)")],
            ["v44 navigation uses a card shell", fs.readFileSync("executiveos-ui.css", "utf8").includes("v44 — card-based navigation") && fs.readFileSync("executiveos-ui.css", "utf8").includes("grid-template-areas:\"brand actions\" \"links links\"")],
            ["navigation items render as individual glass cards", fs.readFileSync("executiveos-ui.css", "utf8").includes(".topbar .navlinks .navbtn{display:inline-flex") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".topbar .navlinks .navbtn.active")],
            ["mobile navigation opens as a card grid", fs.readFileSync("executiveos-ui.css", "utf8").includes(".topbar .navlinks.open{display:grid!important}") && h.includes('classList.toggle("open")')],
            ["v44 responsive layout layer", fs.readFileSync("executiveos-ui.css", "utf8").includes("v43 — coherent sizing") && fs.readFileSync("executiveos-ui.css", "utf8").includes("repeat(auto-fit,minmax(min(100%,190px),1fr))")],
            ["Three.js meshes are limited to outermost cards", fs.readFileSync("three-card-depth.js", "utf8").includes("const allCards = [...document.querySelectorAll(CARD_SELECTOR)]") && fs.readFileSync("three-card-depth.js", "utf8").includes("if (parent.matches && parent.matches(CARD_SELECTOR)) return false")],
            ["nested cards do not receive separate 3D transforms", fs.readFileSync("executiveos-ui.css", "utf8").includes("body.three-card-ready .three-depth-card:hover{transform:none!important")],
            ["manual world save", w.includes("worldSave") && w.includes("localStorage.setItem(KEY")]
          ];
          for (const [name, ok] of checks) console.log((ok ? "PASS " : "FAIL ") + name);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE
