name: Validate ExecutiveOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          node -e 'const fs = require("fs"); const html = fs.readFileSync("index.html", "utf8"); const start = html.indexOf("<script>"); const end = html.indexOf("</script>", start); if (start < 0 || end < 0) throw new Error("Inline script not found"); fs.writeFileSync("/tmp/executiveos.js", html.slice(start + 8, end));'
          node --check /tmp/executiveos.js
      - name: Check dark-only UI and economy features
        run: |
          node -e 'const fs = require("fs"); const h = fs.readFileSync("index.html", "utf8"); const checks = [["dark-only color scheme", /color-scheme:\s*dark/.test(h)], ["passive business income", /function businessIncome\(/.test(h)], ["fictional share market", /function tradeStock\(/.test(h)], ["XP progression", /function awardXP\(/.test(h)], ["earn-money levels", /const earnTiers=/.test(h)], ["earning streak bonus", /state\.earnStreak%5===0/.test(h)], ["cooldown UI refresh", /renderEarnButton\(\)\},1000/.test(h)], ["daily reward", /dailyreward/.test(h)], ["responsive breakpoints", /@media\(max-width:600px\)/.test(h)], ["global expansion", /function expandGlobal\(/.test(h)],, ["asset market page", /id="page-assets" data-route="assets"/.test(h)], ["all asset categories", ["Vehicles","Companies","Real Estate","Crypto","Islands","Cities","Countries"].every(x => h.includes('category:"' + x + '"'))], ["asset purchases and resale", /function buyAsset\(/.test(h) && /function sellAsset\(/.test(h)], ["asset passive income", /assetCatalog\.reduce\(\(sum,a\)=>sum\+\(state\.ownedAssets\[a\.id\]\|\|0\)\*a\.income/.test(h)], ["service worker cache refresh", /CACHE_NAME = CACHE_PREFIX \+ "v4"/.test(fs.readFileSync("sw.js", "utf8"))], ["local saves", /localStorage\.setItem\(KEY/.test(h)]]; const failed = checks.filter(x => !x[1]); checks.forEach(x => console.log((x[1] ? "PASS " : "FAIL ") + x[0])); if (failed.length) process.exit(1);'
