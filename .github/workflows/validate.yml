name: Validate ExecutiveOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("Inline script not found");
          fs.writeFileSync("/tmp/executiveos-inline.js", html.slice(start + 8, end));
          NODE
          node --check /tmp/executiveos-inline.js
          node --check world-sim.js
          node --check sw.js
      - name: Check existing systems and World Simulation
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const w = fs.readFileSync("world-sim.js", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");
          const checks = [
            ["dark-only color scheme", h.includes("color-scheme:dark")],
            ["CEO simulator route", h.includes('id="page-ceo"')],
            ["corporate empire route", h.includes('id="page-corporate"')],
            ["Strategy Lab route", h.includes('id="page-strategy"')],
            ["passive business income", h.includes("function businessIncome(")],
            ["fictional share market", h.includes("function tradeStock(")],
            ["XP progression", h.includes("function awardXP(")],
            ["earn-money levels", h.includes("const earnTiers=")],
            ["responsive breakpoints", h.includes("@media(max-width:600px)")],
            ["asset market page", h.includes('id="page-assets" data-route="assets"')],
            ["World Simulation route", w.includes('page.dataset.route="world"')],
            ["rival corporations", w.includes("rivals") && w.includes("rival:")],
            ["boardroom decisions", w.includes("Boardroom agenda")],
            ["research portfolio", w.toLowerCase().includes("orbital manufacturing")],
            ["world export and import", w.includes("worldExport") && w.includes("worldImport")],
            ["world module loaded", h.includes('src="./world-sim.js"')],
            ["offline world module cached", sw.includes('"world-sim.js"')],
            ["responsive stylesheet linked", h.includes('href="./executiveos-ui.css"')],
            ["responsive stylesheet exists", fs.existsSync("executiveos-ui.css")],
            ["mobile navigation styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:850px)")],
            ["small-screen layout styling", fs.readFileSync("executiveos-ui.css", "utf8").includes("@media(max-width:600px)")],
            ["service worker cache version", sw.includes('CACHE_NAME = CACHE_PREFIX + "v32"')],
            ["charcoal theme matches browser chrome", h.includes('<meta name="theme-color" content="#090a0e">') && fs.readFileSync("manifest.webmanifest", "utf8").includes('"theme_color": "#090a0e"')],
            ["mobile KPI cards remain compact", fs.readFileSync("executiveos-ui.css", "utf8").includes("grid-template-columns:repeat(2,minmax(0,1fr))!important")],
            ["clean monochrome design is present", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified monochrome component system") && fs.readFileSync("executiveos-ui.css", "utf8").includes("--ui-surface:#141414")],
            ["unified clean component system", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified monochrome component system") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".world-toolbar")],
            ["legacy competing theme layers removed", !/Blue-forward visual identity|ExecutiveOS monochrome glass system|Glass card UI|Clean monochrome UI/.test(fs.readFileSync("executiveos-ui.css", "utf8"))],
            ["black-and-white glass cards enabled", fs.readFileSync("executiveos-ui.css", "utf8").includes("Unified black-and-white glass system") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(20px)")],
            ["charcoal black and white text palette is active", fs.readFileSync("executiveos-ui.css", "utf8").includes("--bg:#090a0e") && fs.readFileSync("executiveos-ui.css", "utf8").includes("--text:#f7f8fc") && fs.readFileSync("index.html", "utf8").includes("--green:#f7f8fc")],
            ["navy glow is the only neon accent", fs.readFileSync("executiveos-ui.css", "utf8").includes("--neon-blue:#3156d8") && fs.readFileSync("executiveos-ui.css", "utf8").includes("0 0 32px rgba(35,65,180,.30)")],
            ["PWA browser chrome uses charcoal black", fs.readFileSync("index.html", "utf8").includes('<meta name="theme-color" content="#090a0e">') && fs.readFileSync("manifest.webmanifest", "utf8").includes('"theme_color": "#090a0e"')],
            ["navy-blue neon palette is active", fs.readFileSync("executiveos-ui.css", "utf8").includes("--neon-blue:#4169ff") && fs.readFileSync("executiveos-ui.css", "utf8").includes("rgba(35,75,255,.56)")],
            ["navy-blue neon glass cards and logo glow", fs.readFileSync("executiveos-ui.css", "utf8").includes("Navy-blue neon identity") && fs.readFileSync("executiveos-ui.css", "utf8").includes("0 0 32px rgba(35,75,255,.30)")],
            ["matching navy-glow logo and PWA icons", ["favicon.svg","icon-192.svg","icon-512.svg"].every(file => fs.readFileSync(file, "utf8").includes('flood-color="#4169ff"'))],
            ["offline cache refreshed for neon assets", sw.includes('CACHE_NAME = CACHE_PREFIX + "v32"')],
            ["status label cannot hide navigation", fs.readFileSync("executiveos-ui.css", "utf8").includes(".status{display:none!important}") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".navlinks{display:flex!important;flex:1 1 auto!important")],
            ["navigation bar uses glass treatment", fs.readFileSync("executiveos-ui.css", "utf8").includes(".topbar{") && fs.readFileSync("executiveos-ui.css", "utf8").includes("backdrop-filter:blur(26px)") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".navlinks.open")],
            ["glass styling covers core modules", [".panel,.stat,.card,.feature,.hero-art",".world-kpi,.world-panel",".exec-kpi",".modal,.palette"].every(selector => fs.readFileSync("executiveos-ui.css", "utf8").includes(selector))],
            ["layout wrappers remain visually neutral", fs.readFileSync("executiveos-ui.css", "utf8").includes(".settingsrow,.eventchoices,.actionlist,.feeditem,.strategy-row")],
            ["dashboard captions are not form labels", (h.match(/<span class="stat-label">/g) || []).length === 26 && !/<label>/i.test(h)],
            ["asset search label is associated", h.includes('<label for="assetSearch">Search the entire asset universe</label><input id="assetSearch"')],
            ["save slot label is associated", h.includes('<label for="saveSlot" class="muted smalltext">Slot</label><select class="field" id="saveSlot"')],
            ["reduce motion checkbox has an enclosing label", h.includes('<label class="muted smalltext"><input type="checkbox" id="reduceMotion"> Reduce motion</label>')],
            ["strict three-tone palette is last stylesheet layer", fs.readFileSync("executiveos-ui.css", "utf8").endsWith("\\n") && fs.readFileSync("executiveos-ui.css", "utf8").includes("STRICT THREE-TONE FINISH")],
            ["strict theme maps all semantic status colors to white", /--green:#f7f8fc!important;--green2:#f7f8fc!important;--amber:#f7f8fc!important;--red:#f7f8fc!important/.test(fs.readFileSync("executiveos-ui.css", "utf8"))],
            ["legacy inline shell green accents replaced", !["#b9f27c","#a9ef7020","#5a8c43","#17251a"].some(color => fs.readFileSync("index.html", "utf8").includes(color))],
            ["terminal and world status accents are neutral", fs.readFileSync("executiveos-ui.css", "utf8").includes(".world-good,.world-warn") && fs.readFileSync("executiveos-ui.css", "utf8").includes(".termline.warn,.termline.err,.termline.good{color:#d4d8e2!important}")],
            ["manual world save", w.includes("worldSave") && w.includes("localStorage.setItem(KEY")]
          ];
          for (const [name, ok] of checks) console.log((ok ? "PASS " : "FAIL ") + name);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE
